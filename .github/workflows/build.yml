name: Build and Test hel-compress

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: archlinux:base-devel

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Initialize Pacman and Install Dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm git gcc make pkgconf gtk3 zlib bzip2 zstd openssl

      - name: Build Arch Linux Package via makepkg
        run: |
          useradd -m builder
          chown -R builder:builder .
          chmod 777 .
          
          # نسخ ملف PKGBUILD إلى مجلد المنزل الخاص بالمستخدم المستقل وتشغيل makepkg هناك
          su - builder -c "cp $GITHUB_WORKSPACE/PKGBUILD /home/builder/ && cd /home/builder && makepkg -si --noconfirm"
